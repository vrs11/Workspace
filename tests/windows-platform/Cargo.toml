[package]
name = "workspace-windows-platform-check"
version = "0.0.0"
edition = "2024"
publish = false

# Compile the actual platform sources without needing a Windows WebView SDK on
# the macOS host. This is a type/API check; native tests remain mandatory.
[dependencies]
cap-std = "=3.4.6"
uuid = { version = "=1.29.0", features = ["v4"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
ts-rs = { version = "=11.1.0", features = ["serde-compat"] }
tracing = "=0.1.44"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_IO", "Win32_System_Ioctl", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.27.0"
